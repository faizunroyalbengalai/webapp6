name: Deploy webapp6

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  APP_NAME: webapp6
  APP_PORT: 3000

jobs:
  provision:
    name: Provision EC2
    runs-on: ubuntu-latest
    outputs:
      server_ip: ${{ steps.get_ip.outputs.server_ip }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Write SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      - name: Terraform apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var="project_name=${{ secrets.PROJECT_NAME }}"

      - name: Get server IP
        id: get_ip
        working-directory: terraform
        run: |
          IP=$(terraform output -raw public_ip)
          echo "server_ip=$IP" >> "$GITHUB_OUTPUT"

  configure:
    name: Configure via Ansible
    runs-on: ubuntu-latest
    needs: provision
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ansible python3-pip

      - name: Write SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Wait for SSH
        run: |
          IP="${{ needs.provision.outputs.server_ip }}"
          for i in $(seq 1 30); do
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i /tmp/deploy_key ubuntu@$IP echo ok && break || sleep 10
          done

      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          SERVER_IP="${{ needs.provision.outputs.server_ip }}"
          ansible-playbook -i "$SERVER_IP," \
            --private-key /tmp/deploy_key \
            -u ubuntu \
            -e "app_name=${{ env.APP_NAME }}" \
            -e "app_port=${{ env.APP_PORT }}" \
            -e "python_version=3.11" \
            -e "python_entrypoint=app.main:app" \
            -e "node_version=18" \
            -e "java_version=17" \
            -e "install_db=false" \
            -e "db_type=none" \
            ansible/playbook.yml

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [provision, configure]
    steps:
      - name: Check HTTP response
        run: |
          SERVER_IP="${{ needs.provision.outputs.server_ip }}"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$SERVER_IP:${{ env.APP_PORT }}/ || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "App is up!"
              exit 0
            fi
            sleep 10
          done
          echo "App did not respond in time"
          exit 1

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [provision, verify]
    if: always()
    steps:
      - name: Deployment status
        run: |
          SERVER_IP="${{ needs.provision.outputs.server_ip }}"
          if [ "${{ needs.verify.result }}" = "success" ]; then
            echo "Deployment succeeded!"
            echo "App URL: http://$SERVER_IP:${{ env.APP_PORT }}"
          else
            echo "Deployment failed. Verify step result: ${{ needs.verify.result }}"
            exit 1
          fi